name: Deploy to Somee via FTP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Upload to Somee FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOST_FTP }}
          username: ${{ secrets.USER_FTP }}
          password: ${{ secrets.PASSWORD_FTP }}

          protocol: ftp
          security: loose

          local-dir: "./"
          server-dir: "/wwwroot/"

          exclude: |
            **/.git/**
            **/.github/**
            **/*.yml
            **/node_modules/**
            **/bin/**
            **/obj/**
            .gitignore
            .gitattributes
